<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>덕꾼-dukkun</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header id="header">
        <div class="header-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/dukkun.png" alt="dukkun logo">
                </a>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">홈</a></li>
                    <li><a href="home.html" class="auth-required">덕꾼 임무 목록</a></li>
                    <li class="dropdown">
                        <a href="#" class="auth-required">마이 페이지</a>
                        <ul class="dropdown-menu">
                            <li><a href="mypage.html" class="auth-required">마이 페이지</a></li>
                            <li><a href="chat_list.html" class="auth-required">채팅</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
            <div class="header-auth">
                <button class="btn-login" onclick="location.href='login.html'">로그인</button>
                <button class="btn-signup" onclick="location.href='signup.html'">회원가입</button>
            </div>
        </div>
    </header>

    <main class="login-main">
        <div class="login-container">   
            <h2 class="login-title">WELCOME!</h2>
            <p class="login-subtitle">캠퍼스 라이프의 든든한 지원군, 덕꾼</p>
            <div class="input-group">
                <label>학교 이메일</label>
                <input type="email" id="loginEmail" placeholder="example@duksung.ac.kr">
            </div>
            <div class="input-group">
                <label>비밀번호</label>
                <input type="password" id="loginPw" placeholder="비밀번호 입력">
            </div>
            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox"> 이메일 저장
                </label>
                <a href="findpwd.html" class="find-pw">비밀번호 찾기</a>
            </div>

            <button class="btn-full" id="loginBtn">로그인</button>
            <a href="signup.html" class="go-to-signup">아직 계정이 없으신가요? 회원가입</a>
        </div>
    </main>
    <div id="loginModal" class="modal-overlay hidden">
    <div class="modal-content">
        <span class="material-symbols-rounded modal-icon">error</span>
        <h3>로그인이 필요해요</h3>
        <p>덕꾼의 다양한 기능을 이용하시려면<br>먼저 로그인해 주세요!</p>
        <div class="modal-buttons">
            <button id="closeModalBtn" class="btn-cancel">닫기</button>
            <button id="goToLoginBtn" class="btn-confirm">로그인하러 가기</button>
        </div>
    </div>
</div>
<div id="alertModal" class="modal-overlay hidden">
    <div class="modal-content">
        <span id="alertIcon" class="material-symbols-rounded modal-icon">info</span>
        <h3 id="alertTitle">알림</h3>
        <p id="alertMessage">메시지 내용</p>
        <div class="modal-buttons">
            <button id="alertConfirmBtn" class="btn-confirm">확인</button>
        </div>
    </div>
</div>
    <script type="module" src="js/login.js"></script>
    <script type="module" src="js/script.js"></script>
</body>
</html>

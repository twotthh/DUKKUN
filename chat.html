<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>덕꾼-dukkun</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/chat.css" />
</head>
<body class="chat-body">
    <header id="header">
        <div class="header-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/dukkun.png" alt="dukkun logo">
                </a>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">홈</a></li>
                    <li><a href="home.html">덕꾼 임무 목록</a></li>
                    <li class="dropdown">
                        <a href="#">마이 페이지</a>
                        <ul class="dropdown-menu">
                            <li><a href="mypage.html">마이 페이지</a></li>
                            <li><a href="chat_list.html">채팅</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
            <div class="header-auth" id="headerAuth">
                <div id="loggedOutState">
                    <button class="btn-login" onclick="location.href='login.html'">로그인</button>
                    <button class="btn-signup" onclick="location.href='signup.html'">회원가입</button>
                </div>
                <div id="loggedInState" class="hidden logged-in-state">
                <div class="profile-wrap">
                    <img id="userProfilePic" src="images/monkey.png" alt="프로필" class="profile-pic-small">
                    <span class="user-nickname"><span id="userNickname">덕꾼</span>님, 반가워요!</span>
                </div>

                <div class="noti-wrap">
                    <button id="notiBtn" class="noti-btn">
                        <span class="material-symbols-rounded noti-icon">notifications</span>
                        <span id="notiBadge" class="noti-badge hidden">2</span>
                    </button>
                    
                    <div id="notiDropdown" class="noti-dropdown hidden">
                        <div class="noti-header">
                            <span id="unreadCountText">안 읽은 중요알림 0건</span>
                            <span class="material-symbols-rounded noti-info-icon" title="알림 키워드 설정은 마이페이지에서 수정 가능합니다.">info</span>
                        </div>
                        <div class="noti-list" id="notiList">
                            <div class="noti-empty">도착한 알림이 없습니다.</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </header>

    <main class="chat-main-page">
        <div class="chat-bg-gradients">
            <div class="gradient gradient-1"></div>
            <div class="gradient gradient-2"></div>
        </div>

        <section class="chat-section">
            <div class="chat-paper-frame">
                <div class="chat-header-container">
                    <div class="chat-header-top">
                        <a href="chat_list.html" class="back-link">
                            <span class="material-symbols-rounded">arrow_back</span>
                            목록
                        </a>
                        <span class="opponent-name">덕새예요</span>
                        <div class="spacer"></div>
                    </div>
                    
                    <a href="content.html" class="post-card-link" id="postCardLink">
                        <div class="post-card">
                            <div class="post-info-top">
                                <h2 class="post-title">심부름 제목 불러오는 중...</h2>
                                <span class="post-price">0P</span>
                            </div>
                            <div class="post-meta">
                                <span class="loc"><span class="material-symbols-rounded">location_on</span>출발지</span>
                                <span class="material-symbols-rounded location-arrow">arrow_forward</span>
                                <span class="loc"><span class="material-symbols-rounded">location_on</span>도착지</span>
                            </div>
                        </div>
                    </a>
                </div>

                <div class="chat-area" id="chatArea"></div>
                
                <div class="input-bar">
                    <div class="attach-wrap" style="position: relative;">
                        <button class="attach-btn" id="attachToggleBtn">
                            <span class="material-symbols-rounded">add</span>
                        </button>
                        <div class="attach-menu hidden" id="attachMenu">
                            <div class="attach-item" id="btnFileAttach"><span class="material-symbols-rounded">attach_file</span> 사진/파일 전송</div>
                            <div class="attach-item" id="btnLocation"><span class="material-symbols-rounded">location_on</span> 위치 공유</div>
                            <div class="attach-item" id="btnSendAccount"><span class="material-symbols-rounded">account_balance</span> 계좌 보내기</div>
                            <div class="attach-item" id="btnUrge"><span class="material-symbols-rounded">notifications_active</span> 재촉하기</div>
                        </div>
                        <input type="file" id="fileAttachInput" accept="image/*, .pdf, .hwp, .doc, .docx, .zip, .txt" style="display: none;">
                    </div>
                    <div class="input-wrap">
                        <input type="text" id="msgInput" placeholder="메시지를 입력하세요..." autocomplete="off"/>
                    </div>
                    <button class="send-btn" id="sendBtn">
                        <span class="material-symbols-rounded">send</span>
                    </button>
                </div>    
            </div>
        </section>
    </main>

    <div id="customAlertModal" class="modal-overlay hidden">
        <div class="modal-content" style="text-align: center;">
            <span id="customAlertIcon" class="material-symbols-rounded modal-icon" style="color: var(--primary-color); font-size: 48px;">info</span>
            <h3 id="customAlertTitle" style="margin: 10px 0;">알림</h3>
            <p id="customAlertText" style="color: #666; font-size: 14px; margin-bottom: 20px;">내용이 여기에 표시됩니다.</p>
            <div class="modal-buttons" style="justify-content: center;">
                <button id="customAlertBtn" class="btn-confirm" style="width: 100%;">확인</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/chat.js"></script>
    <script type="module" src="js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>덕꾼-dukkun</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/findpwd.css">
</head>
<body>
    <header id="header">
        <div class="header-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/dukkun.png" alt="dukkun logo">
                </a>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">홈</a></li>
                    <li><a href="home.html">덕꾼 임무 목록</a></li>
                </ul>
            </nav>
            <div class="header-auth">
                <button class="btn-login" onclick="location.href='login.html'">로그인</button>
                <button class="btn-signup" onclick="location.href='signup.html'">회원가입</button>
            </div>
        </div>
    </header>

    <main class="find-pw-main">
        <div class="find-pw-container">
            <h2 class="find-pw-title">비밀번호 찾기</h2>
            <p class="find-pw-subtitle">가입하신 학교 이메일을 입력하시면<br>비밀번호 재설정 링크를 보내드립니다.</p>

            <div id="step-email">
                <div class="input-group">
                    <label for="findEmailInput">학교 이메일</label>
                    <input type="email" id="findEmailInput" placeholder="가입한 이메일 입력 (예: user@duksung.ac.kr)">
                </div>
                <button type="button" class="btn-full" id="sendResetCodeBtn">재설정 링크 전송</button>
            </div>
            
            <div style="text-align:center; margin-top:24px;">
                <a href="login.html" class="back-to-login" style="font-size: 14px; color:var(--primary-color); font-weight:600; text-decoration:none;">로그인 화면으로 돌아가기</a>
            </div>
        </div>
    </main>

    <div id="alertModal" class="modal-overlay hidden">
        <div class="modal-content">
            <span id="alertIcon" class="material-symbols-rounded modal-icon">info</span>
            <h3 id="alertTitle">알림</h3>
            <p id="alertMessage" style="margin-bottom: 24px;">메시지 내용</p>
            <div class="modal-buttons" style="justify-content: center;">
                <button id="alertConfirmBtn" class="btn-confirm" style="width: 100%;">확인</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/findpwd.js"></script>
</body>
</html>
